[package]
name = "radeon_pro_optimus"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "Setup"
path = "src/main.rs"

[[bin]]
name = "inf_patcher"
path = "src/bin/inf_patcher.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
